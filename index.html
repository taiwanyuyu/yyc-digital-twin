<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YYC Digital Universe</title>

<style>
body{
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    margin:0;
    padding:40px;
    text-align:center;
}

h1{
    font-size:48px;
}

.subtitle{
    color:#aaa;
    margin-bottom:50px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    max-width:1200px;
    margin:auto;
}

.card{
    background:#1e1e1e;
    border:1px solid #333;
    border-radius:12px;
    padding:30px;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#66ccff;
}

a{
    color:white;
    text-decoration:none;
}

h2{
    margin-top:0;
}

.footer{
    margin-top:60px;
    color:#666;
}
</style>

</head>
<body>

<h1>YYC Digital Universe</h1>

<div class="subtitle">
Industrial Design × Embodied Intelligence × Offline Runtime
</div>

<div class="grid">

<a href="digital-twin-a/">
<div class="card">
<h2>Digital Twin A</h2>
<p>InkBrain Edition</p>
</div>
</a>

<a href="digital-twin-b/">
<div class="card">
<h2>Digital Twin B</h2>
<p>BoAi Edition</p>
</div>
</a>

<a href="titan-siege/">
<div class="card">
<h2>Titan Siege</h2>
<p>Offline Physics Castle Attack Game</p>
</div>
</a>

<a href="mazinger-z/">
<div class="card">
<h2>Mazinger Z</h2>
<p>Offline Robot Battle Simulation</p>
</div>
</a>

</div>

<div class="footer">
YYC
</div>

</body>
</html>
